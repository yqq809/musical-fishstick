<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鹅的哲学</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="lock-screen">
    <div class="wallpaper-container">
        <img src="1/小猫薯条.gif" alt="动态壁纸" class="wallpaper">
    </div>

    <div class="lock-content">
        <div class="lock-header">
            <div class="brand-logo">
                <svg viewBox="0 0 40 40" width="40" height="40">
                    <circle cx="20" cy="20" r="18" fill="none" stroke="#FF6B6B" stroke-width="2"/>
                    <path d="M20 8 L20 20 L28 28" stroke="#FF6B6B" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="system-time" id="system-time">12:00</div>
        </div>

        <div class="lock-body">
            <h1 class="lock-title">ENTER THE SECRET CODE</h1>
            
            <div class="password-container">
                <div class="password-input-wrapper">
                    <input type="password" id="password-input" placeholder="••••••••" maxlength="8" autocomplete="off">
                    <div class="cursor" id="cursor"></div>
                </div>
                
                <div class="password-hints">
                    <div class="hint-dot" id="hint-1"></div>
                    <div class="hint-dot" id="hint-2"></div>
                    <div class="hint-dot" id="hint-3"></div>
                    <div class="hint-dot" id="hint-4"></div>
                    <div class="hint-dot" id="hint-5"></div>
                    <div class="hint-dot" id="hint-6"></div>
                    <div class="hint-dot" id="hint-7"></div>
                    <div class="hint-dot" id="hint-8"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="hint-btn" id="hint-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="rgba(255,255,255,0.6)">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    <span>提示</span>
                </button>
                
                <button class="unlock-btn" id="unlock-btn">UNLOCK</button>
            </div>

            <div class="hint-message" id="hint-message">
                我们加上联系方式的日子哦
            </div>
        </div>

        <div class="lock-footer">
            <div class="power-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="rgba(255,255,255,0.4)">
                    <path d="M12 3c-1.1 0-2 .9-2 2v5h-2V5c0-1.1-.9-2-2-2s-2 .9-2 2v14c0 1.1.9 2 2 2s2-.9 2-2v-5h2v5c0 1.1.9 2 2 2s2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
